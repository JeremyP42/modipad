; Host simulator for the ModiPAD UI (PC, native).
;
; SEPARATE PlatformIO project - does not affect the ESP-IDF build.
; It compiles the REAL production UI modules directly from ../src (see the
; env.BuildSources() calls in extra_paths.py) against LVGL 8.4 with a thin set
; of host shims in src/ (host_stubs.cpp). No source copies are needed.
;
; Two environments share the same sources/shims; only the window backend
; differs:
;   native        - SDL2 window      (main_host.cpp,      needs SDL2.dll)
;   native_win32  - pure Win32/GDI   (main_host_win32.cpp, no DLL)
;
; Requires a host C/C++ toolchain (MinGW gcc/g++ on PATH; install once with
;   pio pkg install -g -t platformio/toolchain-gccmingw32
; ). Include paths / defines / linker libs are set in extra_paths.py.

[platformio]
default_envs = native

[env]
platform = native

; Compile everything under simulator/src (compat/, cjson/, project/, *.cpp).
build_src_filter = +<*>

; Use the project's local LVGL (lib/lvgl) - no download.
lib_extra_dirs = ../lib
lib_deps =
    lvgl

extra_scripts = pre:extra_paths.py

monitor_port =

; SDL2 window backend (default).
[env:native]
build_src_filter =
    +<*>
    -<main_host_win32.cpp>

; Pure Win32/GDI window backend: exclude the SDL2 entry point.
[env:native_win32]
build_src_filter =
    +<*>
    -<main_host.cpp>
