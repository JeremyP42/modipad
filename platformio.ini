; PlatformIO Project Configuration File
;
; ModiPAD - ESP32-S3 + JC3248W535 (AXS15231B) macro keyboard
; Framework: ESP-IDF (matches the hd2_macropad / JC3248W535EN references)

[platformio]
description = ModiPAD (ESP32-S3 + JC3248W535, ESP-IDF)
default_envs = modipad
boards_dir = boards
data_dir = datadevice
lib_dir = lib
src_dir = src

[env:modipad]
extra_scripts = extra_script.py
platform = espressif32@6.9.0
board = 320x480
monitor_filters = esp32_exception_decoder
framework = espidf
build_type = debug
board_build.filesystem = littlefs
board_build.partitions = partitions/modipad_16MB.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-Wno-maybe-uninitialized
monitor_speed = 115200
upload_speed = 921600
